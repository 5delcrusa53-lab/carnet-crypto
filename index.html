<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121A2C">
<meta name="color-scheme" content="dark">
<title>Carnet Crypto</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121A2C;--panel:#1A2440;--panel2:#222E50;--line:#2C395E;
  --text:#E9EDF6;--muted:#8B96B3;--amber:#F2B84B;--gain:#3FD49B;--loss:#FF7A7A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.top h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em;white-space:nowrap}
.back{background:none;border:0;color:var(--muted);padding:6px 0;font-weight:600}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.iconbtn.spin{opacity:.6;pointer-events:none}
.hero{padding:6px 0 20px}
.hero .cap{color:var(--muted);font-size:13px}
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 6px}
.pnlline{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.gain{color:var(--gain)}.loss{color:var(--loss)}.mut{color:var(--muted)}
.alloc{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel);margin:18px 0 8px;gap:2px}
.alloc span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
h2{font-size:15px;font-weight:700;margin:26px 0 8px;color:var(--muted)}
.list{background:var(--panel);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.item:last-child{border-bottom:0}
button.item:active{background:var(--panel2)}
.item .l{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;flex-shrink:0}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden}
.grid div{background:var(--panel);padding:12px 14px}
.grid .k{font-size:12px;color:var(--muted)}
.grid .v{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;margin:16px 0 0;flex-wrap:wrap}
.btn{flex:1;min-width:120px;border:0;border-radius:12px;padding:13px 14px;font-weight:700;background:var(--panel2);color:var(--text)}
.btn.primary{background:var(--amber);color:#1b1407}
.btn.buy{background:var(--gain);color:#062418}
.btn.sell{background:var(--loss);color:#2b0808}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:none;border:1px solid var(--loss);color:var(--loss)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.tag.buy{background:rgba(63,212,155,.15);color:var(--gain)}
.tag.sell{background:rgba(255,122,122,.15);color:var(--loss)}
.addr{font-size:12px;color:var(--muted);word-break:break-all}
a{color:var(--amber)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(18,26,44,.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;max-width:213px;background:none;border:0;padding:12px 4px 13px;color:var(--muted);font-weight:700;font-size:13px}
nav.tabs button.on{color:var(--amber)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,9,18,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 14px;font-size:18px}
label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;background:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;font-size:16px;font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--ink);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:700;color:var(--muted)}
.seg button.on.buy{background:var(--gain);color:#062418}
.seg button.on.sell{background:var(--loss);color:#2b0808}
.seg button.on.in,.seg button.on.out{background:var(--text);color:var(--ink)}
.seg button{font-size:14px;padding:9px 4px}
.tag.in,.tag.out{background:rgba(233,237,246,.1);color:var(--text)}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.warn{font-size:13px;color:var(--amber);margin:-4px 0 12px}
.results .item{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--ink);
  padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:20;max-width:90vw;text-align:center}
.small{font-size:13px}
.item .gain{color:var(--gain)}.item .loss{color:var(--loss)}
.live{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);font-weight:600}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.live.on i{background:var(--gain);box-shadow:0 0 0 0 rgba(63,212,155,.6);animation:pulse 2s infinite}
.live.busy i{background:var(--amber)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,212,155,.55)}70%{box-shadow:0 0 0 8px rgba(63,212,155,0)}100%{box-shadow:0 0 0 0 rgba(63,212,155,0)}}
@media (prefers-reduced-motion:reduce){.live.on i{animation:none}}
.banner{display:block;width:100%;text-align:left;background:rgba(242,184,75,.1);border:1px solid rgba(242,184,75,.45);color:var(--text);
  border-radius:14px;padding:12px 14px;margin:6px 0 4px;font-weight:600}
.banner span{display:block;font-size:13px;color:var(--muted);font-weight:500}
.note{background:var(--panel);border-left:3px solid var(--amber);border-radius:10px;padding:12px 14px;margin-top:14px;font-size:14px}
.note .btn{margin-top:10px;width:100%}
.chk{display:flex;gap:10px;align-items:flex-start;margin:4px 0 14px;font-size:14px}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--amber);flex-shrink:0}
.chk span small{display:block;color:var(--muted);font-size:13px}
.minibtns{display:flex;gap:6px;flex-shrink:0}
.minibtns button{border:0;border-radius:8px;padding:7px 10px;font-weight:700;font-size:13px;background:var(--panel2)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs">
  <button data-v="home">Portefeuilles</button>
  <button data-v="journal">Journal</button>
  <button data-v="settings">Réglages</button>
</nav>
<script>
"use strict";
const TOKEN_PROGS=['TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA','TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb'];
const CHAINS={
  solana:{n:'Solana',c:'#9945FF',ds:'solana',native:{symbol:'SOL',name:'Solana',wrapped:'So11111111111111111111111111111111111111112',min:0.01}},
  bsc:{n:'BNB Chain',c:'#F0B90B',ds:'bsc',rpc:['https://bsc-rpc.publicnode.com','https://bsc-dataseed.bnbchain.org'],moralis:'bsc',
    native:{symbol:'BNB',name:'BNB',wrapped:'0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c',min:0.001}},
  ethereum:{n:'Ethereum',c:'#7B93F0',ds:'ethereum',rpc:['https://ethereum-rpc.publicnode.com'],moralis:'eth',
    native:{symbol:'ETH',name:'Ether',wrapped:'0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2',min:0.0005}},
  base:{n:'Base',c:'#3B7BFF',ds:'base',rpc:['https://base-rpc.publicnode.com','https://mainnet.base.org'],moralis:'base',
    native:{symbol:'ETH',name:'Ether (Base)',wrapped:'0x4200000000000000000000000000000000000006',min:0.0005}},
  arbitrum:{n:'Arbitrum',c:'#28A0F0',ds:'arbitrum',rpc:['https://arbitrum-one-rpc.publicnode.com'],moralis:'arbitrum',
    native:{symbol:'ETH',name:'Ether (Arbitrum)',wrapped:'0x82aF49447D8a07e3bd95BD0d56f35241523fBab1',min:0.0005}},
  polygon:{n:'Polygon',c:'#A07BEA',ds:'polygon',rpc:['https://polygon-bor-rpc.publicnode.com'],moralis:'polygon',
    native:{symbol:'POL',name:'Polygon',wrapped:'0x0d500B1d8E8eF31E21C99d1Db9A6444d3ADf1270',min:1}},
  other:{n:'Autre',c:'#8B96B3',ds:null}
};
const KEY='carnet-crypto-v1';
const DEF_SETTINGS={base:'USD',usdEur:0.92,rateTs:0,refreshSec:30,hideDust:true,solRpc:'',moralisKey:'',recordBase:false};
let S=load();
let view={name:'home'};
let lastCycle=0,cycling=false;

function load(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!d||!d.portfolios)d={portfolios:[],assets:[],trades:[]};
  d.settings=Object.assign({},DEF_SETTINGS,d.settings||{});
  d.pending=d.pending||[];
  for(const p of d.portfolios)if(p.trackFrom==null)p.trackFrom=Date.now();
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Enregistrement impossible : stockage plein ou bloqué")}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const $=s=>document.querySelector(s);
const num=v=>{if(v==null)return NaN;return parseFloat(String(v).replace(/\s/g,'').replace(',','.'))};
const fx=()=>S.settings.base==='EUR'?(S.settings.usdEur||0.92):1;
const cur=()=>S.settings.base;
const lc=s=>(s||'').toLowerCase();

function money(v,opt={}){
  if(v==null||isNaN(v))return '—';
  const a=Math.abs(v);let o={style:'currency',currency:cur(),currencyDisplay:'narrowSymbol'};
  if(a>0&&a<1)o.maximumSignificantDigits=4;else o.maximumFractionDigits=2;
  let s=new Intl.NumberFormat('fr-FR',o).format(v);
  if(opt.sign&&v>0)s='+'+s;
  return s;
}
function qtyf(v){
  if(v==null||isNaN(v))return '—';
  const a=Math.abs(v);
  const o=a>=1000?{maximumFractionDigits:0}:a>=1?{maximumFractionDigits:4}:{maximumSignificantDigits:5};
  return new Intl.NumberFormat('fr-FR',o).format(v);
}
const pct=v=>v==null||isNaN(v)?'—':(v>0?'+':'')+v.toFixed(2).replace('.',',')+' %';
const cls=v=>v>0?'gain':v<0?'loss':'mut';
const short=a=>a&&a.length>14?a.slice(0,6)+'…'+a.slice(-5):(a||'');
const dateF=d=>new Date(d).toLocaleString('fr-FR',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const ago=ts=>{const s=Math.round((Date.now()-ts)/1000);return s<60?`il y a ${s} s`:s<3600?`il y a ${Math.round(s/60)} min`:dateF(ts)};
const agoS=ts=>{const s=Math.round((Date.now()-ts)/1000);return s<60?s+' s':Math.round(s/60)+' min'};
const sym=a=>a.symbol&&a.symbol!=='?'?a.symbol:short(a.address);
const portOf=a=>S.portfolios.find(p=>p.id===a.portfolioId);
const assetsOf=pid=>S.assets.filter(a=>a.portfolioId===pid);

/* ---------- calculs (coût moyen pondéré) ---------- */
function curPrice(a){
  if(a.manualPrice!=null)return a.manualPrice;
  if(a.priceUsd!=null)return a.priceUsd*fx();
  return null;
}
function calc(a){
  const ts=S.trades.filter(t=>t.assetId===a.id).sort((x,y)=>x.date.localeCompare(y.date)||x.created-y.created);
  let tq=0,tc=0,realized=0,bought=0,sold=0;
  for(const t of ts){
    const fee=t.fee||0;
    if(t.type==='buy'||t.type==='in'){tc+=t.qty*t.price+fee;tq+=t.qty;if(t.type==='buy')bought+=t.qty*t.price+fee}
    else if(t.type==='out'){const avg=tq>0?tc/tq:0,q=Math.min(t.qty,tq);tc-=avg*q;tq-=q}
    else{const avg=tq>0?tc/tq:0,q=Math.min(t.qty,tq),out=avg*q;realized+=t.qty*t.price-fee-out;tc-=out;tq-=q;sold+=t.qty*t.price-fee}
  }
  if(tq<1e-12){tq=0;tc=0}
  const p=portOf(a),synced=!!(p?.sync&&a.chainQty!=null);
  const qty=synced?a.chainQty:tq;
  const avg=tq>0?tc/tq:(synced&&qty>0?null:0);
  const cost=avg==null?null:(synced?avg*qty:tc);
  const price=curPrice(a),value=price!=null?qty*price:null;
  const unreal=value!=null&&cost!=null?value-cost:null;
  const missing=synced?qty-tq:0;
  return {qty,tq,cost,avg,realized,bought,sold,price,value,unreal,synced,
    missing:Math.abs(missing)>Math.max(1e-9,qty*1e-6)?missing:0,
    unrealPct:cost>0&&unreal!=null?unreal/cost*100:null,n:ts.length};
}
function hidden(a,c){
  if(!S.settings.hideDust||!c.synced||c.n>0)return false;
  return c.qty<=0||c.value==null||c.value<1;
}
function totals(assets){
  let value=0,costK=0,unreal=0,realized=0,priced=true;
  for(const a of assets){const c=calc(a);if(hidden(a,c))continue;realized+=c.realized;
    if(c.value!=null)value+=c.value;else if(c.qty>0)priced=false;
    if(c.unreal!=null){unreal+=c.unreal;costK+=c.cost}}
  return {value,unreal,realized,priced,costK,unrealPct:costK>0?unreal/costK*100:null};
}

/* ---------- réseau ---------- */
async function rpc(urls,method,params){
  let err;
  for(const u of [...new Set([].concat(urls).filter(Boolean))]){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),12000);
    try{
      const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params}),signal:controller.signal});
      if(!r.ok)throw new Error(`HTTP ${r.status} sur ${new URL(u).hostname}`);
      const d=await r.json();if(d.error)throw new Error(d.error.message||'RPC');
      return d.result;
    }catch(e){
      err=e.name==='AbortError'?new Error(`Délai dépassé sur ${new URL(u).hostname}`):e;
    }finally{
      clearTimeout(timer);
    }
  }
  throw err||new Error('Aucun RPC disponible');
}
const solRpcs=()=>[
  S.settings.solRpc,
  'https://solana-rpc.publicnode.com',
  'https://api.mainnet-beta.solana.com',
  'https://rpc.ankr.com/solana'
].filter(Boolean);
function hexAmount(h,dec){
  const b=BigInt(!h||h==='0x'?'0x0':h),s=10n**BigInt(dec);
  return Number(b/s)+Number(b%s)/Number(s);
}
async function holdSolana(addr){
  const urls=solRpcs(),m=new Map();
  const bal=await rpc(urls,'getBalance',[addr]);
  m.set(CHAINS.solana.native.wrapped,(bal.value||0)/1e9);

  let complete=true;
  for(const prog of TOKEN_PROGS){
    try{
      const r=await rpc(urls,'getTokenAccountsByOwner',[addr,{programId:prog},{encoding:'jsonParsed'}]);
      for(const acc of r.value||[]){
        const info=acc.account?.data?.parsed?.info;if(!info)continue;
        const q=+info.tokenAmount.uiAmountString||0;
        m.set(info.mint,(m.get(info.mint)||0)+q);
      }
    }catch(e){
      complete=false;
      console.warn(`Lecture tokens Solana impossible pour ${prog}`, e);
    }
  }
  return {list:[...m].map(([address,qty])=>({address,qty})),complete};
}
async function holdEvm(p){
  const ch=CHAINS[p.chain],out=[];
  const wei=await rpc(ch.rpc,'eth_getBalance',[p.address,'latest']);
  out.push({address:ch.native.wrapped,qty:hexAmount(wei,18)});
  const found=new Set([lc(ch.native.wrapped)]);
  let complete=false;
  if(S.settings.moralisKey&&ch.moralis){
    try{
      const r=await fetch(`https://deep-index.moralis.io/api/v2.2/wallets/${p.address}/tokens?chain=${ch.moralis}&exclude_spam=true`,
        {headers:{'X-API-Key':S.settings.moralisKey,accept:'application/json'}});
      if(!r.ok)throw new Error('Moralis '+r.status);
      const d=await r.json();
      for(const t of d.result||[]){
        if(t.native_token||t.possible_spam||!t.token_address)continue;
        out.push({address:t.token_address,qty:+t.balance_formatted||0,symbol:t.symbol,name:t.name});found.add(lc(t.token_address));
      }
      complete=true;
    }catch(e){p.syncErr='Clé Moralis refusée ou quota atteint'}
  }
  const addrData='0x70a08231'+p.address.slice(2).toLowerCase().padStart(64,'0');
  for(const a of assetsOf(p.id)){
    if(!a.address||found.has(lc(a.address))||!/^0x[0-9a-fA-F]{40}$/.test(a.address))continue;
    try{
      if(a.decimals==null)a.decimals=parseInt(await rpc(ch.rpc,'eth_call',[{to:a.address,data:'0x313ce567'},'latest']),16)||18;
      const raw=await rpc(ch.rpc,'eth_call',[{to:a.address,data:addrData},'latest']);
      out.push({address:a.address,qty:hexAmount(raw,a.decimals)});found.add(lc(a.address));
    }catch(e){}
  }
  return {list:out,complete};
}
function flagMove(p,a,delta){
  if(!p.lastSync||histOn(p))return;
  const ch=CHAINS[a.chain];
  if(Math.abs(delta)<=Math.max(1e-9,Math.abs(a.chainQty||0)*1e-6))return;
  if(a.isNative&&Math.abs(delta)<(ch.native?.min||0))return;
  const ex=S.pending.find(x=>x.assetId===a.id);
  if(ex){ex.delta+=delta;ex.ts=Date.now();if(Math.abs(ex.delta)<1e-12)S.pending=S.pending.filter(x=>x!==ex)}
  else S.pending.push({id:uid(),assetId:a.id,delta,price:curPrice(a),ts:Date.now()});
}
function applyHoldings(p,{list,complete}){
  const ch=CHAINS[p.chain],seen=new Set();
  for(const h of list){
    const k=lc(h.address);seen.add(k);
    let a=S.assets.find(x=>x.portfolioId===p.id&&lc(x.address)===k);
    if(!a){
      if(!(h.qty>0))continue;
      const isNative=k===lc(ch.native.wrapped);
      a={id:uid(),portfolioId:p.id,chain:p.chain,address:h.address,isNative,manualPrice:null,auto:true,
        symbol:isNative?ch.native.symbol:(h.symbol||'?'),name:isNative?ch.native.name:(h.name||''),chainQty:0};
      S.assets.push(a);
    }
    if(a.chainQty!=null)flagMove(p,a,h.qty-a.chainQty);
    if(h.symbol&&(!a.symbol||a.symbol==='?')){a.symbol=h.symbol;a.name=h.name||a.name}
    a.chainQty=h.qty;
  }
  if(complete)for(const a of assetsOf(p.id)){
    if(a.address&&!seen.has(lc(a.address))&&a.chainQty){flagMove(p,a,-a.chainQty);a.chainQty=0}
  }
  p.lastSync=Date.now();
}
async function syncAll(){
  let err=0;
  for(const p of S.portfolios.filter(p=>p.sync&&p.address&&p.chain!=='other')){
    try{
      p.syncErr=null;
      const result=p.chain==='solana'?await holdSolana(p.address):await holdEvm(p);
      applyHoldings(p,result);
      if(!result.complete){
        p.syncErr='Solde principal lu, certains tokens sont temporairement indisponibles';
      }
    }catch(e){
      p.syncErr='Lecture du wallet impossible : '+(e?.message||'réseau indisponible');
      err++;
    }
  }
  return err;
}
async function refreshPrices(){
  let ok=0,fail=0;
  if(S.settings.base==='EUR'&&Date.now()-S.settings.rateTs>36e5)await refreshRate(true);
  const by={};
  for(const a of S.assets){const ds=CHAINS[a.chain]?.ds;if(ds&&a.address)(by[ds]??=new Set()).add(a.address)}
  for(const [ds,set] of Object.entries(by)){
    const list=[...set];
    for(let i=0;i<list.length;i+=30){
      const chunk=list.slice(i,i+30);
      try{
        const r=await fetch(`https://api.dexscreener.com/tokens/v1/${ds}/${chunk.join(',')}`);
        if(!r.ok)throw 0;
        const pairs=await r.json();
        for(const a of S.assets.filter(a=>CHAINS[a.chain]?.ds===ds&&chunk.includes(a.address))){
          const best=(pairs||[]).filter(p=>lc(p.baseToken?.address)===lc(a.address))
            .sort((x,y)=>(y.liquidity?.usd||0)-(x.liquidity?.usd||0))[0];
          if(best&&best.priceUsd){
            a.priceUsd=+best.priceUsd;a.change24h=best.priceChange?.h24??null;a.pairUrl=best.url;a.priceTs=Date.now();ok++;
            if(!a.symbol||a.symbol==='?'){a.symbol=best.baseToken.symbol;a.name=best.baseToken.name}
          }else fail++;
        }
      }catch(e){fail+=chunk.length}
    }
  }
  for(const pd of S.pending)if(pd.price==null){const a=S.assets.find(x=>x.id===pd.assetId);if(a)pd.price=curPrice(a)}
  return {ok,fail};
}
async function cycle(manual){
  if(cycling)return;cycling=true;updLive();
  try{
    const e=await syncAll();
    const r=await refreshPrices();
    save();
    const nh=await historyAll();
    save();
    if(nh)toast(`${nh} transaction${nh>1?'s':''} ajoutée${nh>1?'s':''} automatiquement`);
    else if(manual)toast(e?`${e} wallet(s) illisible(s), prix à jour`:`À jour : ${r.ok} prix${r.fail?`, ${r.fail} sans cotation`:''}`);
  }catch(e){if(manual)toast('Pas de connexion')}
  lastCycle=Date.now();cycling=false;updLive();softRender();
}

async function nativeUsdAt(ch,ts){

  const live=S.assets.find(x=>x.chain===ch&&isNat(ch,x.address)&&x.priceUsd!=null);

    const r=await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${BINANCE[ch]}&interval=1m&startTime=${m}&limit=1`);
    const d=await r.json(),v=+d?.[0]?.[1];if(v>0)return kCache[k]=v;
  }catch(e){}
  return live?.priceUsd??null;
}
async function tokenUsdNow(ch,address){
  const a=S.assets.find(x=>x.chain===ch&&lc(x.address)===lc(address)&&x.priceUsd!=null);if(a)return a.priceUsd;
  try{
    const r=await fetch(`https://api.dexscreener.com/tokens/v1/${CHAINS[ch].ds}/${address}`);const pairs=await r.json();
    const b=(pairs||[]).filter(p=>lc(p.baseToken?.address)===lc(address)).sort((x,y)=>(y.liquidity?.usd||0)-(x.liquidity?.usd||0))[0];
    return b?+b.priceUsd:null;
  }catch(e){return null}
}
const usdAt=(ch,address,ts)=>isStable(ch,address)?1:isNat(ch,address)?nativeUsdAt(ch,ts):tokenUsdNow(ch,address);
function ensureAsset(p,address,meta={}){
  let a=S.assets.find(x=>x.portfolioId===p.id&&lc(x.address)===lc(address));if(a)return a;
  const ch=CHAINS[p.chain],nat=isNat(p.chain,address);
  a={id:uid(),portfolioId:p.id,chain:p.chain,address,isNative:nat,manualPrice:null,auto:true,
    symbol:nat?ch.native.symbol:(meta.symbol||'?'),name:nat?ch.native.name:(meta.name||'')};
  S.assets.push(a);return a;
}
function addAuto(p,l,type,qty,usd,ts,sig,feeUsd){
  const a=ensureAsset(p,l.address,l);
  if(S.trades.some(t=>t.sig===sig&&t.assetId===a.id))return false;
  S.trades.push({id:uid(),created:Date.now(),assetId:a.id,type,qty,price:usd!=null?usd*fx():0,fee:(feeUsd||0)*fx(),
    date:nowLocal(ts),note:'',sig,auto:true,noPrice:usd==null});
  return true;
}
/* tx = {sig, ts, deltas:{adresse:{qty,symbol,name}}, feeNative} */
async function classify(p,tx){
  const ch=p.chain,rec=S.settings.recordBase;
  let legs=Object.entries(tx.deltas).map(([address,d])=>({address,...d})).filter(l=>Math.abs(l.qty)>1e-12);
  const nat=legs.find(l=>isNat(ch,l.address));
  // petite variation de SOL à côté d'un autre mouvement = loyer de compte / pourboire, pas un échange
  if(nat&&legs.length>1&&Math.abs(nat.qty)<(CHAINS[ch].native.min*0.3))legs=legs.filter(l=>l!==nat);
  if(!legs.length)return 0;
  const gains=legs.filter(l=>l.qty>0),losses=legs.filter(l=>l.qty<0);
  const natUsd=await nativeUsdAt(ch,tx.ts);
  let fee=tx.feeNative&&natUsd?tx.feeNative*natUsd:0,n=0;
  const valOf=async list=>{let v=0;for(const l of list){const u=await usdAt(ch,l.address,tx.ts);if(u==null)return null;v+=Math.abs(l.qty)*u}return v};
  if(gains.length&&losses.length){
    const bl=losses.filter(l=>isBase(ch,l.address)),bg=gains.filter(l=>isBase(ch,l.address));
    let value=bl.length&&!bg.length?await valOf(bl):bg.length&&!bl.length?await valOf(bg):null;
    if(value==null)value=(await valOf(losses))??(await valOf(gains));
    for(const [list,type] of [[gains,'buy'],[losses,'sell']]){
      const nb=list.filter(l=>!isBase(ch,l.address));
      for(const l of list){
        const base=isBase(ch,l.address);if(base&&!rec)continue;
        const q=Math.abs(l.qty);
        const u=base?await usdAt(ch,l.address,tx.ts):(value!=null&&nb.length===1?value/q:await usdAt(ch,l.address,tx.ts));
        if(addAuto(p,l,type,q,u,tx.ts,tx.sig,fee)){n++;fee=0}
      }
    }
  }else{
    for(const l of legs){
      const base=isBase(ch,l.address);if(base&&!rec)continue;
      const u=await usdAt(ch,l.address,tx.ts);
      if(l.qty>0&&u==null&&!base){
        const known=S.assets.find(a=>a.portfolioId===p.id&&lc(a.address)===lc(l.address));
        if(!known||!S.trades.some(t=>t.assetId===known.id))continue; // airdrop de spam sans cotation
      }
      if(addAuto(p,l,l.qty>0?'in':'out',Math.abs(l.qty),u,tx.ts,tx.sig,0))n++;
    }
  }
  return n;
}
function solDeltas(tx,addr){
  const m=tx?.meta;if(!m||m.err)return null;
  const keys=(tx.transaction.message.accountKeys||[]).map(k=>k.pubkey||k);
  const W=CHAINS.solana.native.wrapped,deltas={},add=(a,q)=>{(deltas[a]??={qty:0}).qty+=q};
  const i=keys.indexOf(addr);let feeNative=0;
  if(i>=0){let d=(m.postBalances[i]-m.preBalances[i])/1e9;if(i===0){feeNative=m.fee/1e9;d+=feeNative}if(Math.abs(d)>1e-9)add(W,d)}
  for(const b of m.preTokenBalances||[])if(b.owner===addr)add(b.mint,-(+b.uiTokenAmount.uiAmountString||0));
  for(const b of m.postTokenBalances||[])if(b.owner===addr)add(b.mint,+b.uiTokenAmount.uiAmountString||0);
  return {deltas,feeNative};
}
async function solHistory(p){
  const h=p.hist??={last:null,queue:[]},urls=solRpcs();
  let before=null,newest=null,batch=[];
  for(let page=0;page<5;page++){
    const opt={limit:200};if(before)opt.before=before;if(h.last)opt.until=h.last;
    const res=await rpc(urls,'getSignaturesForAddress',[p.address,opt]);
    if(!res?.length)break;
    newest??=res[0].signature;
    let stop=false;
    for(const s of res){
      if(s.blockTime&&s.blockTime*1000<p.trackFrom){stop=true;break}
      if(!s.err)batch.push({sig:s.signature,ts:(s.blockTime||Date.now()/1000)*1000});
    }
    if(stop||res.length<200)break;before=res[res.length-1].signature;
  }
  if(newest){h.queue=h.queue.concat(batch.reverse());h.last=newest}
  let n=0,done=0;
  while(h.queue.length&&done<15){
    const q=h.queue[0];
    const tx=await rpc(urls,'getTransaction',[q.sig,{encoding:'jsonParsed',maxSupportedTransactionVersion:0,commitment:'confirmed'}]);
    const d=solDeltas(tx,p.address);
    if(d)n+=await classify(p,{sig:q.sig,ts:tx.blockTime?tx.blockTime*1000:q.ts,...d});
    h.queue.shift();done++;
  }
  return n;
}
async function evmHistory(p){
  const ch=CHAINS[p.chain],h=p.hist??={};h.seen??=[];
  const from=new Date(h.fromTs||p.trackFrom).toISOString(),me=lc(p.address),W=ch.native.wrapped;
  const r=await fetch(`https://deep-index.moralis.io/api/v2.2/wallets/${p.address}/history?chain=${ch.moralis}&from_date=${encodeURIComponent(from)}&order=ASC&limit=50`,
    {headers:{'X-API-Key':S.settings.moralisKey,accept:'application/json'}});
  if(!r.ok)throw new Error('Moralis '+r.status);
  const d=await r.json();let n=0;
  for(const t of d.result||[]){
    if(h.seen.includes(t.hash))continue;
    const ts=Date.parse(t.block_timestamp)||Date.now();
    if(String(t.receipt_status)!=='0'){
      const deltas={},add=(a,q,meta={})=>{const x=deltas[a]??={qty:0,...meta};x.qty+=q};
      for(const x of t.native_transfers||[]){const v=+x.value_formatted||0;if(lc(x.to_address)===me)add(W,v);if(lc(x.from_address)===me)add(W,-v)}
      for(const x of t.erc20_transfers||[]){
        if(x.possible_spam)continue;const v=+x.value_formatted||0,meta={symbol:x.token_symbol,name:x.token_name};
        if(lc(x.to_address)===me)add(x.address,v,meta);if(lc(x.from_address)===me)add(x.address,-v,meta);
      }
      n+=await classify(p,{sig:t.hash,ts,deltas,feeNative:lc(t.from_address)===me?(+t.transaction_fee||0):0});
    }
    h.seen.push(t.hash);h.fromTs=ts;
  }
  h.seen=h.seen.slice(-300);
  return n;
}
async function historyAll(){
  let n=0;
  for(const p of S.portfolios.filter(histOn)){
    try{p.histErr=null;n+=p.chain==='solana'?await solHistory(p):await evmHistory(p)}
    catch(e){p.histErr='Import des transactions en pause ('+(e.message||'réseau')+'), nouvel essai automatique'}
  }
  return n;
}

async function searchTokens(q,chain){
  const ds=CHAINS[chain]?.ds;
  const isAddr=q.length>=30&&!/\s/.test(q);
  const url=isAddr?`https://api.dexscreener.com/latest/dex/tokens/${q}`:`https://api.dexscreener.com/latest/dex/search?q=${encodeURIComponent(q)}`;
  const r=await fetch(url);if(!r.ok)throw new Error('http');
  const d=await r.json(),m=new Map();
  for(const p of d.pairs||[]){
    if(ds&&p.chainId!==ds)continue;
    if(isAddr&&lc(p.baseToken?.address)!==lc(q))continue;
    const tok=p.baseToken,k=p.chainId+':'+lc(tok.address),liq=p.liquidity?.usd||0;
    if(!m.has(k)||m.get(k).liq<liq)m.set(k,{chain:p.chainId,address:tok.address,symbol:tok.symbol,name:tok.name,price:+p.priceUsd,liq,url:p.url,ch:p.priceChange?.h24});
  }
  return [...m.values()].sort((a,b)=>b.liq-a.liq).slice(0,8);
}

/* ---------- feuilles / formulaires ---------- */
function sheet(title,body){
  closeSheet();
  const d=document.createElement('div');d.className='scrim';d.id='scrim';
  d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${body}</div>`;
  d.addEventListener('click',e=>{if(e.target===d)closeSheet()});
  document.body.appendChild(d);
}
function closeSheet(){$('#scrim')?.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const chainOpts=sel=>Object.entries(CHAINS).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${v.n}</option>`).join('');
function validAddr(chain,a){
  if(chain==='solana')return /^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a);
  if(chain==='other')return true;
  return /^0x[0-9a-fA-F]{40}$/.test(a);
}

function formPortfolio(id){
  const p=id?S.portfolios.find(x=>x.id===id):null;
  sheet(p?'Modifier le wallet':'Ajouter un wallet',`
  <label class="f">Nom<input id="pn" value="${esc(p?.name||'')}" placeholder="Phantom principal"></label>
  <label class="f">Blockchain<select id="pc">${chainOpts(p?.chain||'solana')}</select></label>
  <label class="f">Adresse publique du wallet<input id="pa" value="${esc(p?.address||'')}" placeholder="Adresse de réception" autocapitalize="off" spellcheck="false"></label>
  <label class="chk"><input type="checkbox" id="ps" ${!p||p.sync?'checked':''}>
    <span>Suivre ce wallet en direct<small>Lit le solde et importe les achats, ventes et réceptions. Décoche pour tout saisir à la main.</small></span></label>
  <label class="f">Importer les transactions à partir du<input type="date" id="pf" value="${new Date((p?.trackFrom||Date.now())-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}"></label>
  <div class="hint">Par défaut, la date d'ajout du wallet. Tu peux choisir une date plus ancienne pour reprendre ton historique (jusqu'à 1 000 transactions sur Solana).</div>
  <div class="hint">Ne saisis jamais ta phrase de récupération ni ta clé privée : l'adresse publique suffit.</div>
  <div class="actions"><button class="btn primary" onclick="savePortfolio('${id||''}')">${p?'Enregistrer':'Ajouter le wallet'}</button></div>
  ${p?`<div class="actions"><button class="btn danger" onclick="delPortfolio('${p.id}')">Supprimer le wallet</button></div>`:''}`);
  setTimeout(()=>$('#pn')?.focus(),60);
}
function savePortfolio(id){
  const name=$('#pn').value.trim(),chain=$('#pc').value,address=$('#pa').value.trim(),sync=$('#ps').checked&&chain!=='other';
  if(!name)return toast('Donne un nom au wallet');
  if(sync&&!address)return toast('Indique l\'adresse publique pour le suivi en direct');
  if(address&&!validAddr(chain,address))return toast(`Cette adresse ne correspond pas à ${CHAINS[chain].n}`);
  const pf=$('#pf').value,today=new Date().toISOString().slice(0,10);
  let trackFrom=pf?new Date(pf+'T00:00').getTime():Date.now();
  const d={name,chain,address,sync};
  if(id){const p=S.portfolios.find(x=>x.id===id);
    if(p.address!==address||p.chain!==chain){p.lastSync=0;p.hist=null}
    if(pf!==new Date(p.trackFrom-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)){p.trackFrom=trackFrom;p.hist=null}
    Object.assign(p,d)}
  else{id=uid();if(pf===today)trackFrom=Date.now();S.portfolios.push({id,trackFrom,...d})}
  save();closeSheet();go('portfolio',id);
  if(sync)cycle(false);
}
function delPortfolio(id){
  const n=assetsOf(id).length;
  if(!confirm(`Supprimer ce wallet${n?` et ses ${n} token(s) avec leurs transactions`:''} ?`))return;
  const ids=assetsOf(id).map(a=>a.id);
  S.trades=S.trades.filter(t=>!ids.includes(t.assetId));S.pending=S.pending.filter(x=>!ids.includes(x.assetId));
  S.assets=S.assets.filter(a=>a.portfolioId!==id);S.portfolios=S.portfolios.filter(p=>p.id!==id);save();closeSheet();go('home');
}
function formAsset(pid){
  const p=S.portfolios.find(x=>x.id===pid);
  sheet('Ajouter un token',`
  <label class="f">Blockchain<select id="ac">${chainOpts(p?.chain||'solana')}</select></label>
  <label class="f">Nom, symbole ou adresse du contrat<input id="aq" placeholder="BONK ou adresse du token" autocapitalize="off" spellcheck="false"
    onkeydown="if(event.key==='Enter')doSearch('${pid}')"></label>
  <div class="actions" style="margin:0 0 14px"><button class="btn primary" onclick="doSearch('${pid}')">Rechercher</button></div>
  <div id="ares" class="list results"></div>
  <div class="hint" style="margin-top:14px">Token introuvable ? <a href="#" onclick="formManualAsset('${pid}');return false">Ajouter à la main</a></div>`);
  setTimeout(()=>$('#aq')?.focus(),60);
}
async function doSearch(pid){
  const q=$('#aq').value.trim(),chain=$('#ac').value,box=$('#ares');
  if(!q)return;
  if(!CHAINS[chain].ds)return formManualAsset(pid);
  box.innerHTML='<div class="empty">Recherche…</div>';
  try{
    const r=await searchTokens(q,chain);window._res=r;
    const f=o=>new Intl.NumberFormat('fr-FR',Object.assign({style:'currency',currency:'USD',currencyDisplay:'narrowSymbol'},o));
    box.innerHTML=r.length?r.map((t,i)=>`<button class="item" onclick="pickToken('${pid}',${i})">
      <div class="l"><div class="t">${esc(t.symbol)} <span class="mut" style="font-weight:500">${esc(t.name)}</span></div>
      <div class="s">${esc(short(t.address))} – liquidité ${f({notation:'compact'}).format(t.liq)}</div></div>
      <div class="r"><div class="t">${f({maximumSignificantDigits:4}).format(t.price)}</div></div></button>`).join('')
      :`<div class="empty"><b>Aucun résultat sur ${CHAINS[chain].n}</b>Vérifie la blockchain choisie ou colle l'adresse du contrat.</div>`;
  }catch(e){box.innerHTML='<div class="empty"><b>Recherche impossible</b>Vérifie ta connexion, ou ajoute le token à la main.</div>'}
}
function pickToken(pid,i){
  const t=window._res[i];
  const chain=Object.keys(CHAINS).find(k=>CHAINS[k].ds===t.chain)||'other';
  const dup=S.assets.find(a=>a.portfolioId===pid&&a.chain===chain&&lc(a.address)===lc(t.address));
  if(dup){closeSheet();return go('asset',dup.id)}
  const a={id:uid(),portfolioId:pid,chain,address:t.address,symbol:t.symbol,name:t.name,priceUsd:t.price,change24h:t.ch??null,pairUrl:t.url,priceTs:Date.now(),manualPrice:null,
    isNative:lc(t.address)===lc(CHAINS[chain].native?.wrapped)};
  S.assets.push(a);save();closeSheet();go('asset',a.id);
  if(portOf(a)?.sync)cycle(false);
}
function formManualAsset(pid){
  const p=S.portfolios.find(x=>x.id===pid);
  sheet('Ajouter un token à la main',`
  <div class="row2"><label class="f">Symbole<input id="ms" placeholder="XYZ" autocapitalize="characters"></label>
  <label class="f">Blockchain<select id="mc">${chainOpts(p?.chain||'other')}</select></label></div>

function saveManualAsset(pid){

  const mp=num($('#mp').value);

function formManualPrice(id){
  const a=S.assets.find(x=>x.id===id);

  <label class="f">Prix unitaire en ${cur()}<input id="mp" inputmode="decimal" value="${a.manualPrice!=null?String(a.manualPrice).replace('.',','):''}"></label>

function delAsset(id){
  const a=S.assets.find(x=>x.id===id);

/* mouvements détectés */
function sheetPending(){
  const list=S.pending.map(pd=>({pd,a:S.assets.find(x=>x.id===pd.assetId)})).filter(x=>x.a).sort((x,y)=>y.pd.ts-x.pd.ts);
  if(!list.length)return closeSheet();
  sheet('Mouvements détectés',`<div class="hint" style="margin:0 0 12px">Le solde de ces tokens a changé depuis la dernière lecture. Un échange (swap) apparaît en deux lignes : une vente d'un token et un achat d'un autre.</div>
  <div class="list">${list.map(({pd,a})=>`<div class="item">
    <div class="l"><div class="t ${pd.delta>0?'gain':'loss'}">${pd.delta>0?'+':'−'}${qtyf(Math.abs(pd.delta))} ${esc(sym(a))}</div>
    <div class="s">${esc(portOf(a)?.name||'')} – ${ago(pd.ts)}${pd.price!=null?' – '+money(Math.abs(pd.delta)*pd.price):''}</div></div>
    <div class="minibtns"><button class="${pd.delta>0?'gain':'loss'}" onclick="recordPending('${pd.id}')">${pd.delta>0?'Achat':'Vente'}</button>
    <button onclick="ignorePending('${pd.id}')" title="Transfert, airdrop, frais…">Ignorer</button></div></div>`).join('')}</div>
  <div class="hint" style="margin-top:12px">« Ignorer » convient aux transferts entre tes wallets, airdrops et frais de réseau.</div>`);
}
function recordPending(id){
  const pd=S.pending.find(x=>x.id===id);if(!pd)return;
  const a=S.assets.find(x=>x.id===pd.assetId);
  formTrade(a.id,pd.delta>0?'buy':'sell','',{qty:Math.abs(pd.delta),price:pd.price??curPrice(a),date:pd.ts,pending:pd.id});
}
function ignorePending(id){S.pending=S.pending.filter(x=>x.id!==id);save();softRender();S.pending.length?sheetPending():closeSheet()}

function nowLocal(d){const x=d?new Date(d):new Date();return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,16)}
function formTrade(aid,type,tid,pre={}){
  const a=S.assets.find(x=>x.id===aid),t=tid?S.trades.find(x=>x.id===tid):null;
  const c=calc(a);type=t?.type||type;
  const fmt=v=>v===''||v==null||isNaN(v)?'':String(+(+v).toPrecision(10)).replace('.',',');
  const q=t?t.qty:pre.qty,p=t?t.price:(pre.price??c.price);
  window._pend=pre.pending||null;
  const ex=t?.sig&&EXPLORER[a.chain]?EXPLORER[a.chain]+t.sig:null;
  sheet(t?'Modifier la transaction':`${TL[type]} : ${sym(a)}`,`
  <div class="seg">${Object.entries(TL).map(([k,v])=>`<button data-t="${k}" class="${k} ${type===k?'on':''}" onclick="setType('${k}')">${v}</button>`).join('')}</div>
  ${t?.auto?`<div class="hint">Importée automatiquement${ex?` – <a href="${ex}" target="_blank" rel="noopener">voir sur l'explorateur</a>`:''}.${t.noPrice?' Prix introuvable à cette date : saisis-en un manuellement.':''}</div>`:''}
  <input type="hidden" id="ttype" value="${type}">
  <label class="f">Date et heure<input type="datetime-local" id="td" value="${nowLocal(t?.date||pre.date)}"></label>
  <label class="f">Quantité de ${esc(sym(a))}<input id="tq" inputmode="decimal" value="${fmt(q)}" oninput="syncTotal()"></label>
  <div id="tqw" class="warn" style="display:none"></div>
  <div class="row2">
    <label class="f">Prix unitaire (${cur()})<input id="tp" inputmode="decimal" value="${fmt(p)}" oninput="syncTotal()"></label>
    <label class="f">Montant total (${cur()})<input id="tt" inputmode="decimal" oninput="syncPrice()"></label>
  </div>
  <div class="hint">Remplis le prix unitaire ou le montant total, l'autre se calcule. ${pre.pending?'Prix pré-rempli : cotation au moment de la détection, corrige-le si besoin.':''}</div>
  <label class="f">Frais (${cur()})<input id="tf" inputmode="decimal" value="${fmt(t?.fee||'')}" placeholder="0"></label>
  <label class="f">Note (facultatif)<input id="tn" value="${esc(t?.note||'')}" placeholder="Jupiter, PancakeSwap…"></label>
  <div class="actions"><button class="btn primary" onclick="saveTrade('${aid}','${tid||''}')">${t?'Enregistrer':'Ajouter la transaction'}</button></div>
  ${t?`<div class="actions"><button class="btn danger" onclick="delTrade('${tid}')">Supprimer la transaction</button></div>`:''}`);
  window._held=c.tq+(t&&(t.type==='sell'||t.type==='out')?t.qty:0)-(t&&(t.type==='buy'||t.type==='in')?t.qty:0);
  syncTotal();
  setTimeout(()=>(q?$('#tp'):$('#tq'))?.focus(),80);
}
function setType(ty){$('#ttype').value=ty;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===ty));checkQty()}
function syncTotal(){const q=num($('#tq').value),p=num($('#tp').value);if(!isNaN(q)&&!isNaN(p))$('#tt').value=String(+(q*p).toPrecision(10)).replace('.',',');checkQty()}
function syncPrice(){const q=num($('#tq').value),t=num($('#tt').value);if(!isNaN(q)&&q>0&&!isNaN(t))$('#tp').value=String(+(t/q).toPrecision(10)).replace('.',',')}
function checkQty(){
  const w=$('#tqw');if(!w)return;const q=num($('#tq').value);
  if(['sell','out'].includes($('#ttype').value)&&!isNaN(q)&&q>(window._held||0)+1e-12){w.style.display='block';w.textContent=`Ton historique ne compte que ${qtyf(window._held||0)} achetés. L'excédent ne peut pas être vendu.`}
  else w.style.display='none';
}
function saveTrade(aid,tid){
  const q=num($('#tq').value),p=num($('#tp').value),f=num($('#tf').value);
  if(isNaN(q)||q<=0)return toast('Indique une quantité supérieure à 0');
  if(isNaN(p)||p<0)return toast('Indique un prix unitaire ou un montant total');
  const d={assetId:aid,type:$('#ttype').value,date:$('#td').value||nowLocal(),qty:q,price:p,fee:isNaN(f)?0:f,note:$('#tn').value.trim(),noPrice:false};
  if(tid)Object.assign(S.trades.find(x=>x.id===tid),d);else S.trades.push({id:uid(),created:Date.now(),...d});
  const pend=window._pend;window._pend=null;
  if(pend)S.pending=S.pending.filter(x=>x.id!==pend);
  save();closeSheet();render();toast(tid?'Transaction modifiée':'Transaction ajoutée');
  if(pend&&S.pending.length)setTimeout(sheetPending,300);
}
function delTrade(id){if(!confirm('Supprimer cette transaction ?'))return;S.trades=S.trades.filter(t=>t.id!==id);save();closeSheet();render()}

/* ---------- réglages ---------- */
function setBase(v){
  if(S.trades.length&&!confirm('Les montants déjà saisis ne seront pas convertis. Changer quand même ?'))return render();
  S.settings.base=v;save();render();if(v==='EUR')refreshRate().then(render);
}
function setRate(v){const n=num(v);if(isNaN(n)||n<=0)return toast('Taux invalide');S.settings.usdEur=n;S.settings.rateTs=Date.now();save();render()}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const name=`carnet-crypto-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}
  const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Sauvegarde exportée');
}
function importData(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!Array.isArray(d.portfolios)||!Array.isArray(d.assets)||!Array.isArray(d.trades))throw 0;
    if(!confirm(`Importer ${d.portfolios.length} wallet(s) et ${d.trades.length} transaction(s) ? Les données actuelles seront remplacées.`))return;
    d.settings=Object.assign({},DEF_SETTINGS,d.settings||{});d.pending=d.pending||[];S=d;save();go('home');toast('Sauvegarde importée');lastCycle=0;
  }catch(e){toast("Ce fichier n'est pas une sauvegarde Carnet Crypto")}};
  r.readAsText(file);
}
function resetAll(){if(!confirm('Effacer toutes les données de cet appareil ? Pense à exporter avant.'))return;localStorage.removeItem(KEY);S=load();go('home')}
function copy(t){navigator.clipboard?.writeText(t).then(()=>toast('Adresse copiée'),()=>toast('Copie impossible'))}
let tt;function toast(m){$('.toast')?.remove();clearTimeout(tt);const d=document.createElement('div');d.className='toast';d.textContent=m;d.setAttribute('role','status');document.body.appendChild(d);tt=setTimeout(()=>d.remove(),2500)}

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
render();
if(navigator.onLine&&liveOn())cycle(false);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
